<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2333"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Subtle grid datum lines -->
  <line x1="12" y1="24" x2="52" y2="24" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 3" stroke-width="1"/>
  <line x1="12" y1="40" x2="52" y2="40" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 3" stroke-width="1"/>

  <!-- Shaded trace area under curve -->
  <path d="M 12 48 L 12 44 C 18 45, 22 41, 26 35 C 30 29, 34 33, 40 25 C 45 19, 48 18, 52 15 L 52 48 Z" fill="url(#area)"/>

  <!-- Stock trace path -->
  <path d="M 12 44 C 18 45, 22 41, 26 35 C 30 29, 34 33, 40 25 C 45 19, 48 18, 52 15"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Intermediate trace points -->
  <circle cx="26" cy="35" r="2" fill="#60a5fa" opacity="0.7"/>
  <circle cx="40" cy="25" r="2.2" fill="#34d399" opacity="0.85"/>

  <!-- Active trace pulse beacon -->
  <circle cx="52" cy="15" r="5.5" fill="#34d399" opacity="0.25"/>
  <circle cx="52" cy="15" r="3" fill="#34d399"/>
  <circle cx="52" cy="15" r="1.2" fill="#ffffff"/>
</svg>
