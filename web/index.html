<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace Stocks — Option Scanner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">Tr</span>
      <div>
        <h1>Trace Stocks</h1>
        <p class="muted">Option scanner results</p>
      </div>
    </div>
    <div class="topbar-meta">
      <button id="refresh" class="btn">Refresh</button>
      <span id="last-updated" class="muted small"></span>
    </div>
  </header>

  <main>
    <section id="cards" class="cards" aria-label="Per-symbol summaries"></section>

    <section class="grid-2">
      <div class="panel">
        <h2>Premium % distribution</h2>
        <canvas id="dist-chart" height="180"></canvas>
      </div>
      <div class="panel">
        <h2>Recent scans</h2>
        <ul id="scans" class="scans"></ul>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Results</h2>
        <span id="result-count" class="muted small"></span>
      </div>

      <form id="filters" class="filters" onsubmit="return false;">
        <label>
          Symbol
          <select id="f-symbol"><option value="">All</option></select>
        </label>
        <label>
          Right
          <select id="f-right">
            <option value="">All</option>
            <option value="C">Call</option>
            <option value="P">Put</option>
          </select>
        </label>
        <label>
          Min DTE
          <input id="f-min-dte" type="number" min="0" />
        </label>
        <label>
          Max DTE
          <input id="f-max-dte" type="number" min="0" />
        </label>
        <label>
          Min %
          <input id="f-min-pct" type="number" step="0.1" min="0" />
        </label>
        <label>
          Max %
          <input id="f-max-pct" type="number" step="0.1" min="0" />
        </label>
        <label>
          Scan
          <select id="f-scan"><option value="">All scans</option></select>
        </label>
        <button id="f-apply" class="btn primary" type="button">Apply</button>
        <button id="f-clear" class="btn"          type="button">Clear</button>
      </form>

      <div class="table-wrap">
        <table id="results-table">
          <thead>
            <tr>
              <th data-key="symbol">Symbol</th>
              <th data-key="right">Right</th>
              <th data-key="strike" class="num">Strike</th>
              <th data-key="expiration">Expiration</th>
              <th data-key="dte" class="num">DTE</th>
              <th data-key="premium" class="num">Premium</th>
              <th data-key="premiumPct" class="num">Premium %</th>
              <th data-key="iv" class="num">IV</th>
              <th data-key="delta" class="num">Δ</th>
              <th data-key="theta" class="num">Θ</th>
              <th data-key="volume" class="num">Vol</th>
              <th data-key="underlyingPrice" class="num">Underlying</th>
              <th data-key="scannedAt">Scanned</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
